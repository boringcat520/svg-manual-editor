<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">SVG 手动编辑器</title>
  <desc id="desc">由流程图形、正交连接线和矢量节点构成的专业 SVG 编辑器图标</desc>
  <defs>
    <linearGradient id="background" x1="76" y1="54" x2="438" y2="466" gradientUnits="userSpaceOnUse">
      <stop stop-color="#243451"/>
      <stop offset=".52" stop-color="#17243A"/>
      <stop offset="1" stop-color="#0D1627"/>
    </linearGradient>
    <linearGradient id="blueBlock" x1="108" y1="128" x2="282" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2E87B8"/>
      <stop offset="1" stop-color="#185274"/>
    </linearGradient>
    <linearGradient id="greenBlock" x1="278" y1="312" x2="408" y2="396" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5D865F"/>
      <stop offset="1" stop-color="#365940"/>
    </linearGradient>
    <linearGradient id="connector" x1="276" y1="188" x2="358" y2="324" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFAE58"/>
      <stop offset="1" stop-color="#E56E32"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#A9BDD5" stroke-opacity=".11" stroke-width="2"/>
    </pattern>
    <clipPath id="workspaceClip">
      <rect x="72" y="72" width="368" height="368" rx="54"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#050A12" flood-opacity=".42"/>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#03070D" flood-opacity=".30"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#background)" filter="url(#shadow)"/>
  <rect x="25.5" y="25.5" width="461" height="461" rx="102.5" fill="none" stroke="#8296B4" stroke-opacity=".28" stroke-width="3"/>

  <g clip-path="url(#workspaceClip)">
    <rect x="72" y="72" width="368" height="368" rx="54" fill="#101B2C" fill-opacity=".48"/>
    <rect x="72" y="72" width="368" height="368" rx="54" fill="url(#grid)"/>
    <path d="M74 136C174 78 337 71 438 122V72H72Z" fill="#FFFFFF" fill-opacity=".035"/>
  </g>
  <rect x="73.5" y="73.5" width="365" height="365" rx="52.5" fill="none" stroke="#9DB0CA" stroke-opacity=".24" stroke-width="3"/>

  <g fill="none" stroke="#B7C8DD" stroke-linecap="round" stroke-width="7" opacity=".68">
    <path d="M96 142V110Q96 96 110 96H142"/>
    <path d="M370 96H402Q416 96 416 110V142"/>
    <path d="M416 370V402Q416 416 402 416H370"/>
    <path d="M142 416H110Q96 416 96 402V370"/>
  </g>

  <g filter="url(#lift)">
    <rect x="106" y="132" width="178" height="116" rx="25" fill="url(#blueBlock)" stroke="#74CAEF" stroke-width="6"/>
    <rect x="280" y="312" width="130" height="84" rx="22" fill="url(#greenBlock)" stroke="#B5DF8D" stroke-width="6"/>
  </g>

  <g fill="none" stroke="#D8F2FF" stroke-linecap="round" opacity=".92">
    <path d="M133 166H235" stroke-width="10"/>
    <path d="M133 190H257" stroke-width="10"/>
    <path d="M133 214H213" stroke-width="10"/>
  </g>
  <g fill="none" stroke="#E1F3D2" stroke-linecap="round" opacity=".92">
    <path d="M302 342H382" stroke-width="9"/>
    <path d="M302 366H357" stroke-width="9"/>
  </g>

  <path d="M284 190H350V290" fill="none" stroke="#0A1322" stroke-opacity=".38" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M284 190H350V290" fill="none" stroke="url(#connector)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M323 283 350 329 377 283Z" fill="#E56E32" stroke="#FFF0E5" stroke-opacity=".72" stroke-width="3" stroke-linejoin="round"/>

  <g fill="#F8FBFF" stroke="#28628F" stroke-width="7">
    <circle cx="284" cy="190" r="13"/>
    <circle cx="350" cy="190" r="13"/>
  </g>
  <circle cx="106" cy="190" r="11" fill="#F8FBFF" stroke="#28628F" stroke-width="7"/>
</svg>
